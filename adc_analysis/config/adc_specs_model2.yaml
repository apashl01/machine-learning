# ADC Model 2 Specifications
# High-speed RF ADC with integrated DDC capability
# Noise specified in dBFS/Hz format
# Real mode, M=1 (no decimation) for comparison with Model 1

name: ADC_Model_2
description: "RF ADC with DDC, dBFS/Hz noise specs, real mode M=1"

# Sample Rate
sample_rate_gsps: 4.0

# Operating Mode
mode: real
decimation_factor: 1   # M = 1, no decimation

# Noise Specification Format: 'dBc/Hz' or 'dBFS/Hz'
noise_units: dBFS/Hz

# Frequency Bands (GHz)
freq_bands:
  - [0.1, 12]     # Band 1: 0.1 - 12 GHz
  - [12, 22]      # Band 2: 12 - 22 GHz
  - [22, 32]      # Band 3: 22 - 32 GHz
  - [32, 36]      # Band 4: 32 - 36 GHz

# Full Scale Amplitude per Band (mVppd)
full_scale_mvppd:
  - 2000    # Band 1: 2000 mVppd
  - 1900    # Band 2: 1900 mVppd
  - 1700    # Band 3: 1700 mVppd
  - 1500    # Band 4: 1500 mVppd

# Input Impedance (differential)
input_impedance_ohm: 50

# Differential Return Loss per Band (dB)
return_loss_db:
  - -15     # Band 1: -15 dB
  - -14     # Band 2: -14 dB
  - -13     # Band 3: -13 dB
  - -12     # Band 4: -12 dB

# Spurious-Free Dynamic Range per Band (dBFS)
sfdr_db:
  - 72      # Band 1: 72 dBFS
  - 70      # Band 2: 70 dBFS
  - 68      # Band 3: 68 dBFS
  - 66      # Band 4: 66 dBFS

# Noise Spectral Density per Band (dBFS/Hz)
noise_density:
  - -165    # Band 1: -165 dBFS/Hz
  - -163    # Band 2: -163 dBFS/Hz
  - -161    # Band 3: -161 dBFS/Hz
  - -159    # Band 4: -159 dBFS/Hz

noise_ref_level_dbfs: 0     # Not used for dBFS/Hz, but included for consistency

# Total Harmonic Distortion per Band (dBc)
thd_dbc:
  - -50     # Band 1: -50 dBc
  - -48     # Band 2: -48 dBc
  - -46     # Band 3: -46 dBc
  - -44     # Band 4: -44 dBc

thd_ref_level_dbfs: -1      # Typical reference level

# Third-Order Intermodulation Distortion per Band (dBc)
im3_dbc:
  - -72     # Band 1: -72 dBc
  - -70     # Band 2: -70 dBc
  - -68     # Band 3: -68 dBc
  - -66     # Band 4: -66 dBc

im3_ref_level_dbfs: -7      # Reference level per tone

notes:
  - "RF ADC with integrated DDC"
  - "Real mode, M=1 (no decimation) for fundamental comparison"
  - "dBFS/Hz noise specification format"
  - "DDC features not included in this analysis"
