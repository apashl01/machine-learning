# ADC Analysis Configuration
# Performance analysis parameters for ADC-based receiver systems

# ADC Specifications
adc:
  # Basic specs
  bits: 10                      # Nominal ADC resolution
  enob: 8.0                     # Effective number of bits
  sample_rate_gsps: 64.0        # Sample rate (GSPS)
  fullscale_dbm: -1.1           # Full scale input power (dBm)
  max_input_dbm: 12.0           # Maximum input before damage (dBm)
  impedance_ohm: 100            # Differential input impedance

  # Noise specs
  nsd_dbfs_hz: -153             # Noise spectral density (dBFS/Hz)

  # Distortion specs
  sfdr_dbc: 55                  # Spurious-free dynamic range (dBc)
  thd_dbc: -60                  # Total harmonic distortion (dBc)
  imd3_dbc: -60                 # 3rd order intermodulation (dBc)

  # Timing specs
  aperture_jitter_ps: 0.5       # Aperture jitter (ps RMS)
  clock_jitter_fs: 100          # Clock jitter (fs RMS)

# LNA Specifications (sweep ranges for optimization)
lna:
  gain_range_db: [10, 15, 20, 25, 30, 35, 40]    # Gain options to analyze
  nf_range_db: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]   # NF options to analyze
  p1db_dbm: 25                                   # 1dB compression point

# Passive Component Losses
passive:
  cable_loss_db: 3.0
  coupler_loss_db: 0.5
  switch_loss_db: 1.0
  filter_loss_db: 0.8

# Receiver Antenna
antenna:
  gain_dbi: 2.0

# Analysis Parameters
analysis:
  # Bandwidth
  analysis_bw_mhz: 20           # Channelized analysis bandwidth (MHz)
  effective_fs_msps: 50         # Effective sample rate at analysis stage

  # Detection
  detection_threshold_db: 13    # SNR threshold for detection
  snr_required_db: 10           # Required SNR for measurements

  # Physical
  temperature_k: 290            # System temperature (Kelvin)
  impedance_ohm: 50             # System impedance

  # Signal parameters (for measurement accuracy)
  signal_freq_ghz: 10           # Typical signal frequency
  input_signal_dbm: -30         # Input signal level for measurement analysis

  # Pulse widths to analyze (microseconds)
  pulse_widths_us: [0.1, 1, 10, 100]

  # FFT lengths
  fft_lengths: [1024, 4096, 16384]

  # IFM parameters
  ifm_delay_ns: 1               # IFM delay line (ns)

  # Interferometer baseline (wavelengths)
  baseline_wavelengths: 1.0

# Saturation Analysis
saturation:
  # EIRP values to analyze (dBm)
  eirp_values_dbm: [20, 40, 60, 80, 90, 100, 110]

  # Distance range (miles)
  distance_min_miles: 1
  distance_max_miles: 50
  distance_points: 500

  # Frequency for path loss
  frequency_ghz: 5
