# RF Chain Configuration
# Matches MATLAB rf_chain_config_example.m structure

# Chain settings
chain:
  name: "Example TX Chain"
  description: "Cable -> LNA -> Attenuator -> Cable -> PA"
  type: transmit                    # 'transmit' or 'receive'
  source_power_dbm: 0               # For TX mode
  freq_range_ghz: [0.1, 36]         # Analysis frequency range

  # For RX mode with damage analysis (uncomment if needed):
  # input_power_range_dbm: [-60, 20]
  # damage_level_dbm: 10

# Components - each with type, name, order, and type-specific params
components:
  # Cable 1 - RG316 Coax, 1 meter
  # Loss follows sqrt(f) model defined by two points
  cable1:
    type: cable
    name: "RG316_1m"
    order: 1
    loss_point1_ghz: 1
    loss_point1_db: 0.5
    loss_point2_ghz: 18
    loss_point2_db: 2.0

  # Amplifier 1 - Low Noise Amplifier
  amp1:
    type: amplifier
    name: "LNA_34dB"
    order: 2
    gain_db: 34
    noise_figure_db: 2.0
    psat_dbm: 20

  # Attenuator 1 - Variable attenuator
  # Attenuation varies linearly across frequency range
  atten1:
    type: attenuator
    name: "VarAtten"
    order: 3
    atten_min_db: 0.5
    atten_max_db: 1.5

  # Cable 2 - Another coax run
  cable2:
    type: cable
    name: "RG316_0p5m"
    order: 4
    loss_point1_ghz: 1
    loss_point1_db: 0.25
    loss_point2_ghz: 18
    loss_point2_db: 1.0

  # Amplifier 2 - Power amplifier
  amp2:
    type: amplifier
    name: "PA_20dB"
    order: 5
    gain_db: 20
    noise_figure_db: null           # Not specified for TX amp
    psat_dbm: 35

