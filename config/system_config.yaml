# EW System Shared Configuration
# This file defines parameters shared across all analysis packages
# Changes here propagate to: ESM, Direction Finding, EKF Geolocation, RF Chain

# =============================================================================
# FREQUENCY CONFIGURATION
# =============================================================================
frequency:
  min_ghz: 0.5                    # Minimum operating frequency
  max_ghz: 18.0                   # Maximum operating frequency
  reference_ghz: 9.0             # Reference frequency for single-freq calculations

# =============================================================================
# ADC CONFIGURATION
# =============================================================================
adc:
  model: "High-Speed RF ADC"
  sample_rate_gsps: 51.0          # Sample rate (>2x max freq for Nyquist)
  resolution_bits: 10

  # Noise specification (choose format: dBc/Hz or dBFS/Hz)
  noise_format: "dBFS/Hz"         # 'dBc/Hz' or 'dBFS/Hz'

  # Per-band specifications (matched to frequency bands)
  bands:
    band_1:
      freq_range_ghz: [0.50, 6.0]
      noise_density_db: -165      # dBFS/Hz or dBc/Hz depending on format
      sfdr_db: 72
      full_scale_dbm: 0           # Full scale input level
      enob: 7.5                  # Effective number of bits
    band_2:
      freq_range_ghz: [6.0, 12.0]
      noise_density_db: -163
      sfdr_db: 70
      full_scale_dbm: -1
      enob: 7.2
    band_3:
      freq_range_ghz: [12.0, 18.0]
      noise_density_db: -160
      sfdr_db: 68
      full_scale_dbm: -2
      enob: 7.0

  # System-level derived parameters (calculated)
  input_impedance_ohm: 50

  # Timing specs (Task 1.1: Consolidated from adc_config.yaml)
  aperture_jitter_ps: 0.5       # Aperture jitter (ps RMS)
  clock_jitter_fs: 100          # Clock jitter (fs RMS)

# =============================================================================
# PASSIVE COMPONENT SPECS (Task 1.1: Consolidated from adc_config.yaml)
# =============================================================================
passive_components:
  cable_loss_db: 3.0
  coupler_loss_db: 0.5
  switch_loss_db: 1.0
  filter_loss_db: 0.8

# =============================================================================
# ENVIRONMENT PARAMETERS (Task 1.1: Consolidated from esm_analysis config)
# =============================================================================
environment:
  temperature_k: 290              # Ambient temperature (Kelvin)
  propagation_model: "free_space" # free_space, two_ray, ITU_P676
  include_atmospheric_loss: false

# =============================================================================
# RF CHAIN CONFIGURATION
# =============================================================================
rf_chains:
  # -------------------------------------------------------------------------
  # RECEIVE PATHS
  # -------------------------------------------------------------------------
  rx_paths:
    # Primary RX (2-18 GHz) - 7 paths
    rx_2_18ghz:
      name: "Primary RX (2-18 GHz)"
      num_paths: 7
      freq_range_ghz: [2.0, 18.0]
      cascade_noise_figure_db: 3.5
      total_gain_db: 30.0
      damage_threshold_dbm: 10
      components:
        - name: "Spiral Antenna"
          type: "spiral"
          gain_db: 3.0
          noise_figure_db: 0.0
        - name: "LNA"
          type: "amplifier"
          gain_db: 25.0
          noise_figure_db: 1.5
        - name: "Cable"
          type: "coax"
          gain_db: -2.0
          noise_figure_db: 2.0
        - name: "Filter"
          type: "bandpass"
          gain_db: -1.5
          noise_figure_db: 1.5

    # Low-band RX (<2 GHz) - 1 path
    rx_low_band:
      name: "Low-Band RX (<2 GHz)"
      num_paths: 1
      freq_range_ghz: [0.5, 2.0]
      cascade_noise_figure_db: 4.0
      total_gain_db: 20.0
      damage_threshold_dbm: 15
      components:
        - name: "Wideband Antenna"
          type: "dipole"
          gain_db: -5.0
          noise_figure_db: 0.0
        - name: "LNA"
          type: "amplifier"
          gain_db: 20.0
          noise_figure_db: 2.0
        - name: "Cable"
          type: "coax"
          gain_db: -1.0
          noise_figure_db: 1.0

  # -------------------------------------------------------------------------
  # TRANSMIT PATHS
  # -------------------------------------------------------------------------
  tx_paths:
    # Primary TX (2-18 GHz) - 1 path, narrow beam
    tx_2_18ghz:
      name: "Primary TX (2-18 GHz)"
      num_paths: 1
      freq_range_ghz: [2.0, 18.0]
      source_power_dbm: 0
      total_gain_db: 45.0
      components:
        - name: "Driver Amp"
          type: "amplifier"
          gain_db: 20.0
          psat_dbm: 20
        - name: "Cable"
          type: "coax"
          gain_db: -2.0
        - name: "PA"
          type: "amplifier"
          gain_db: 25.0
          psat_dbm: 42
        - name: "Horn Antenna"
          type: "horn"
          gain_db: 12.0
          beamwidth_deg: 30.0

    # Low-band TX (<2 GHz) - 1 path, wide beam
    tx_low_band:
      name: "Low-Band TX (<2 GHz)"
      num_paths: 1
      freq_range_ghz: [0.5, 2.0]
      source_power_dbm: 0
      total_gain_db: 30.0
      components:
        - name: "Driver Amp"
          type: "amplifier"
          gain_db: 25.0
          psat_dbm: 25
        - name: "Cable"
          type: "coax"
          gain_db: -1.5
        - name: "PA"
          type: "amplifier"
          gain_db: 10.0
          psat_dbm: 30
        - name: "Omni Antenna"
          type: "omni"
          gain_db: -2.0
          beamwidth_deg: 360.0

# =============================================================================
# INTERFEROMETER CONFIGURATION (Single Source of Truth)
# =============================================================================
interferometer:
  # Array configuration
  n_elements: 4
  freq_range_ghz: [2.0, 18.0]     # Task 3: Operating frequency range (not 0.5-18)
  c_light_in_per_ns: 11.8028      # Speed of light (inches/nanosecond)

  # Element positions (inches) - Vernier spacing
  # Shortest baseline = lambda/2 at max frequency for ambiguity resolution
  # At 18 GHz: lambda = 0.656", lambda/2 = 0.328"
  element_positions: [0.0, 0.328, 3.5, 10.0]

  # Phase measurement error at high SNR (baseline system noise)
  phase_error_high_snr_deg: 12.0

  # Maximum incident angle for valid measurements
  max_incident_angle_deg: 70.0

  # Mounting configuration (for EKF geolocation)
  mounting:
    offset_body_m: [0.0, 0.0, 1.5]  # [X forward, Y right, Z down]
    orientation_deg: [0.0, 0.0, 0.0]  # [Roll, Pitch, Yaw]

# =============================================================================
# PLATFORM CONFIGURATION (Task 1.1: Consolidated from uav_config.yaml)
# =============================================================================
platform:
  name: "UAV Platform"
  # UAV dimensions (meters)
  geometry:
    length_m: 2.0
    width_m: 2.5      # Increased for wing-mounted antennas

  # Operational parameters
  altitude_m: 5000    # Default operating altitude MSL
  speed_mps: 100      # Platform speed (m/s)

# =============================================================================
# ANTENNA CONFIGURATION (Task 1.1: Consolidated from uav_config.yaml)
# =============================================================================
antennas:
  # ESM/DF antenna pattern (interferometer elements use this)
  esm_peak_gain_dbi: 3.0
  esm_beamwidth_deg: 70
  esm_type: "spiral"
  esm_polarization: "LHCP"
  esm_front_to_back_db: 15

  # -------------------------------------------------------------------------
  # RECEIVE ANTENNAS
  # -------------------------------------------------------------------------
  # RX antenna positions [x, y, z] in meters
  # Coordinate system: X=forward, Y=right, Z=up
  rx_antennas:
    # 2-18 GHz RX Antennas (7 total) - Interferometer/ESM
    # Nose antennas (2)
    - name: "Nose Left"
      position: [0.8, -0.15, 0.0]
      orientation: [-45, 0]       # [azimuth, elevation] in degrees
      freq_band: "2-18 GHz"
      type: "spiral"
      peak_gain_dbi: 3.0
      beamwidth_deg: 70

    - name: "Nose Right"
      position: [0.8, 0.15, 0.0]
      orientation: [45, 0]
      freq_band: "2-18 GHz"
      type: "spiral"
      peak_gain_dbi: 3.0
      beamwidth_deg: 70

    # Left fuselage antennas (4 in a line for interferometer)
    - name: "Left Fuse 1"
      position: [0.1, -0.6, 0.0]
      orientation: [-90, 0]
      freq_band: "2-18 GHz"
      type: "spiral"
      peak_gain_dbi: 3.0
      beamwidth_deg: 70

    - name: "Left Fuse 2"
      position: [0.05, -0.6, 0.0]
      orientation: [-90, 0]
      freq_band: "2-18 GHz"
      type: "spiral"
      peak_gain_dbi: 3.0
      beamwidth_deg: 70

    - name: "Left Fuse 3"
      position: [-0.05, -0.6, 0.0]
      orientation: [-90, 0]
      freq_band: "2-18 GHz"
      type: "spiral"
      peak_gain_dbi: 3.0
      beamwidth_deg: 70

    - name: "Left Fuse 4"
      position: [-0.1, -0.6, 0.0]
      orientation: [-90, 0]
      freq_band: "2-18 GHz"
      type: "spiral"
      peak_gain_dbi: 3.0
      beamwidth_deg: 70

    # Right fuselage antenna (1)
    - name: "Right Fuse"
      position: [0.0, 0.6, 0.0]
      orientation: [90, 0]
      freq_band: "2-18 GHz"
      type: "spiral"
      peak_gain_dbi: 3.0
      beamwidth_deg: 70

    # Low-band RX (<2 GHz) - 1 antenna
    - name: "Low-Band RX"
      position: [-0.4, 1.0, 0.0]   # Right wing
      orientation: [0, 0]
      freq_band: "<2 GHz"
      type: "dipole"
      peak_gain_dbi: -5.0
      beamwidth_deg: 120

  # -------------------------------------------------------------------------
  # TRANSMIT ANTENNAS
  # -------------------------------------------------------------------------
  tx_antennas:
    # 2-18 GHz TX - Narrow beam horn, forward facing
    - name: "TX Horn (2-18 GHz)"
      position: [0.8, 0.0, 0.0]   # Nose, centered
      orientation: [0, 0]
      freq_band: "2-18 GHz"
      type: "horn"
      beamwidth_deg: 30
      peak_gain_dbi: 12

    # <2 GHz TX - Wide beam/omni, wing-mounted
    - name: "TX Low-Band (<2 GHz)"
      position: [-0.4, -1.0, 0.0]   # Left wing
      orientation: [0, 0]
      freq_band: "<2 GHz"
      type: "omni"
      beamwidth_deg: 360
      peak_gain_dbi: -2

# =============================================================================
# DERIVED SYSTEM PARAMETERS (Calculated at runtime)
# =============================================================================
# These are computed from the above parameters:
# - system_noise_floor_dbm: Thermal + RF chain NF + ADC contribution
# - sensitivity_dbm: Minimum detectable signal
# - dynamic_range_db: From noise floor to damage threshold
