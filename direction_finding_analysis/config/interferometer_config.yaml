# 1D RF Interferometer Configuration
# Matches MATLAB rf_interferometer_analysis.m

# System parameters
system:
  n_elements: 4
  freq_range_ghz: [2, 18]          # Operating frequency range
  phase_error_deg: 12              # Phase error at high SNR (baseline system noise)
  signal_strength_dbm: -60         # Input signal strength
  noise_floor_dbm: -100            # System noise floor

# Speed of light in inches/nanosecond
c_light_in_per_ns: 11.8028

# Element positions (inches)
# Non-uniform (Vernier) spacing for ambiguity resolution
# Total aperture = 10 inches for accuracy
element_positions: [0, 0.328, 3.5, 10.0]  # d_short = lambda/2 at 18 GHz ≈ 0.328"

# Analysis parameters
analysis:
  incident_angles_range: [-80, 80]  # Degrees off boresight
  angle_step: 0.5                   # Degree resolution
  test_frequencies_ghz: [2, 5, 10, 15, 18]

# Optional antenna pattern file
antenna_pattern:
  file: null                        # 'antenna_pattern.csv' if available
  frequency_ghz: 9                  # Frequency at which pattern was measured
