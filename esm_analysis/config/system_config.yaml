# =============================================================================
# ESM SYSTEM CONFIGURATION
# =============================================================================
# Central configuration file for ESM receiver system parameters.
# All frequency values in Hz, power in dBm/dBW, distances in meters.
# =============================================================================

system:
  name: "ESM Receiver System"
  description: "Wideband ESM receiver for threat detection"
  version: "1.0"

# -----------------------------------------------------------------------------
# RECEIVER PARAMETERS
# -----------------------------------------------------------------------------
receiver:
  # Frequency coverage
  freq_min_hz: 2.0e9          # Minimum frequency (2 GHz)
  freq_max_hz: 18.0e9         # Maximum frequency (18 GHz)

  # Antenna parameters
  antenna:
    gain_dbi: 2.0             # ESM antenna gain (typically low for wide coverage)
    pattern_type: "omnidirectional"  # omnidirectional, spiral, horn
    azimuth_coverage_deg: 360  # Azimuth coverage
    elevation_coverage_deg: 120  # Elevation coverage (+/- 60 deg)

  # Receiver sensitivity
  noise_figure_db: 6.0        # Receiver noise figure
  bandwidth_hz: 20.0e6        # Instantaneous bandwidth (20 MHz)
  system_losses_db: 3.0       # Cable, filter, implementation losses

  # Detection thresholds
  snr_threshold_db: 10.0      # Minimum SNR for detection declaration

  # Tuning parameters (for channelized/scanning receivers)
  tune_time_us: 50.0          # Time to retune receiver (microseconds)
  settling_time_us: 10.0      # Settling time after tune

# -----------------------------------------------------------------------------
# PLATFORM PARAMETERS
# -----------------------------------------------------------------------------
platform:
  name: "UAV Platform"
  altitude_m: 5000            # Platform altitude (meters MSL)
  speed_mps: 100              # Platform speed (m/s)

  # Antenna installation
  antenna_positions:
    - name: "nose_left"
      position_m: [0.8, -0.15, 0.0]
      orientation_deg: [-45, 0]
    - name: "nose_right"
      position_m: [0.8, 0.15, 0.0]
      orientation_deg: [45, 0]
    - name: "left_fuselage"
      position_m: [0.0, -0.6, 0.0]
      orientation_deg: [-90, 0]
    - name: "right_fuselage"
      position_m: [0.0, 0.6, 0.0]
      orientation_deg: [90, 0]

# -----------------------------------------------------------------------------
# ENVIRONMENTAL PARAMETERS
# -----------------------------------------------------------------------------
environment:
  temperature_k: 290          # Ambient temperature (Kelvin)
  propagation_model: "free_space"  # free_space, two_ray, ITU_P676
  include_atmospheric_loss: false

# -----------------------------------------------------------------------------
# ANALYSIS REQUIREMENTS
# -----------------------------------------------------------------------------
analysis:
  # Detection requirements
  required_detection_range_m: 100000  # Default required detection range (100 km)

  # Sidelobe analysis parameters
  sidelobe_levels:
    main_beam_offset_db: 0.0   # Main beam reference (0 dB)
    first_sidelobe_db: -20.0   # First sidelobe level relative to main beam
    back_lobe_db: -30.0        # Back lobe level relative to main beam

  # Scheduling parameters
  default_scan_positions: 8    # Default number of scan positions for scheduling
  dwell_margin_factor: 1.5     # Multiply PRI by this for dwell time
  sidelobe_check_interval_s: 60.0  # Check interval for sidelobe-detectable threats

  # Reporting
  verbose: true
  debug_output: true
  generate_plots: true

# -----------------------------------------------------------------------------
# OUTPUT CONFIGURATION
# -----------------------------------------------------------------------------
output:
  results_dir: "./results"
  save_csv: true
  save_json: true
  plot_format: "png"          # png, pdf, svg
  plot_dpi: 150
