# UAV Antenna Coverage Configuration
# Matches MATLAB uav_antenna_coverage.m

# System parameters
system:
  frequency_ghz: 9.0

# UAV dimensions (meters)
uav:
  length: 2.0
  width: 2.5     # Increased for wing-mounted antennas

# =============================================================================
# RECEIVE ANTENNAS
# =============================================================================

# Spiral antenna specifications (for RX 2-18 GHz)
spiral_antenna:
  beamwidth_deg: 70           # 3dB beamwidth
  gain_dbi: 2                 # Peak gain in dBi
  front_to_back_db: 15        # Front-to-back ratio

# RX antenna positions [x, y, z] in meters
# Coordinate system: X=forward, Y=right, Z=up
rx_antennas:
  # 2-18 GHz RX Antennas (7 total) - Interferometer/ESM
  # Nose antennas (2)
  - name: "Nose Left"
    position: [0.8, -0.15, 0.0]
    orientation: [-45, 0]       # 45 degrees left
    freq_band: "2-18 GHz"
    type: "spiral"

  - name: "Nose Right"
    position: [0.8, 0.15, 0.0]
    orientation: [45, 0]        # 45 degrees right
    freq_band: "2-18 GHz"
    type: "spiral"

  # Left fuselage antennas (4 in a line)
  - name: "Left Fuse 1"
    position: [0.1, -0.6, 0.0]
    orientation: [-90, 0]       # Pointing left
    freq_band: "2-18 GHz"
    type: "spiral"

  - name: "Left Fuse 2"
    position: [0.05, -0.6, 0.0]
    orientation: [-90, 0]
    freq_band: "2-18 GHz"
    type: "spiral"

  - name: "Left Fuse 3"
    position: [-0.05, -0.6, 0.0]
    orientation: [-90, 0]
    freq_band: "2-18 GHz"
    type: "spiral"

  - name: "Left Fuse 4"
    position: [-0.1, -0.6, 0.0]
    orientation: [-90, 0]
    freq_band: "2-18 GHz"
    type: "spiral"

  # Right fuselage antenna (1)
  - name: "Right Fuse"
    position: [0.0, 0.6, 0.0]
    orientation: [90, 0]        # Pointing right
    freq_band: "2-18 GHz"
    type: "spiral"

  # Low-band RX (<2 GHz) - 1 antenna
  # (Position TBD - placeholder)
  - name: "Low-Band RX"
    position: [0.0, 0.0, 0.2]   # Top of fuselage
    orientation: [0, 0]         # Pointing up/forward
    freq_band: "<2 GHz"
    type: "dipole"

# =============================================================================
# TRANSMIT ANTENNAS
# =============================================================================

# TX antenna specifications
tx_antennas:
  # 2-18 GHz TX - Narrow beam horn, forward facing
  - name: "TX Horn (2-18 GHz)"
    position: [0.8, 0.0, 0.0]   # Nose, centered
    orientation: [0, 0]         # Pointing forward (positive X)
    freq_band: "2-18 GHz"
    type: "horn"
    beamwidth_deg: 30
    gain_dbi: 12

  # <2 GHz TX - Wide beam/omni, wing-mounted (1 antenna)
  - name: "TX Low-Band (<2 GHz)"
    position: [-0.4, -1.0, 0.0]   # Left wing
    orientation: [0, 0]           # Pointing forward (positive X)
    freq_band: "<2 GHz"
    type: "omni"
    beamwidth_deg: 360
    gain_dbi: -2

# Legacy field for backwards compatibility
antenna_positions:
  # Nose antennas (2)
  - name: "Nose Left"
    position: [0.8, -0.15, 0.0]
    orientation: [-45, 0]

  - name: "Nose Right"
    position: [0.8, 0.15, 0.0]
    orientation: [45, 0]

  # Left fuselage antennas (4 in a line)
  - name: "Left Fuse 1"
    position: [0.1, -0.6, 0.0]
    orientation: [-90, 0]

  - name: "Left Fuse 2"
    position: [0.05, -0.6, 0.0]
    orientation: [-90, 0]

  - name: "Left Fuse 3"
    position: [-0.05, -0.6, 0.0]
    orientation: [-90, 0]

  - name: "Left Fuse 4"
    position: [-0.1, -0.6, 0.0]
    orientation: [-90, 0]

  # Right fuselage antenna (1)
  - name: "Right Fuse"
    position: [0.0, 0.6, 0.0]
    orientation: [90, 0]

# Analysis parameters
analysis:
  azimuth_range: [-180, 180]
  elevation_range: [-90, 90]
  angular_resolution: 2         # degrees
